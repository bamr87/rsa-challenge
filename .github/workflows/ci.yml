name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    strategy: { matrix: { python: ["3.10", "3.13"] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: No secrets committed
        run: python3 scripts/check_no_secrets.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Frontend verify.js self-test
        run: node scripts/js_selftest.mjs
      - name: Public challenges are well-formed
        run: python3 -m rsa_challenge list
