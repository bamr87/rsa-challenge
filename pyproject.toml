[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsa-challenge"
version = "0.2.0"
description = "Generate and verify RSA factoring / decryption challenges (stdlib only)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
rsa-challenge = "rsa_challenge.cli:main"

[tool.setuptools]
packages = ["rsa_challenge"]
